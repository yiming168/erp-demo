<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <title>{% block title %}NorthPeak Biotech ERP{% endblock %}</title>
    <meta property="og:title" content="NorthPeak Biotech ERP — Live Demo">
    <meta property="og:description" content="Full-stack ERP demo built with Python/Flask/MySQL: orders, clients, shipments, finished-goods & raw-material inventory, procurement, finance, statistics, and AI smart query.">
    <meta property="og:image" content="https://erp-demo.newbio.net/static/og-image.png">
    <meta property="og:url" content="https://erp-demo.newbio.net/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        /* Bootstrap's .container locks to a fixed width (540px/720px) starting at the sm/md
           breakpoints, and phones in landscape usually land right in that range, leaving the
           page narrower than the screen with padding on both sides. This keeps .container at
           full screen width below the lg breakpoint (992px); desktop/tablet widths are unaffected. */
        @media (max-width: 991.98px) {
            .container {
                max-width: 100%;
            }
        }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body>
    {% if demo_mode %}
    <div class="alert alert-info mb-0 round
