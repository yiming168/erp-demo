{% extends "base.html" %}
{% set active_page = "procurement" %}

{% block title %}Edit Supplier - NorthPeak Biotech ERP{% endblock %}

{% block content %}
<div class="container" style="max-width:700px">
    <h4><i class="bi bi-pencil-square"></i> Edit Supplier</h4>
    <hr>

    <div class="card">
        <div class="card-body">
            <form action="{{ url_for('edit_supplier', supplier_id=supplier.supplier_id) }}" method="POST">
                <div class="mb-3">
                    <label for="supplier_name" class="form-label">Supplier Name</label>
                    <input type="text" class="form-control" id="supplier_name" name="supplier_name" value="{{ supplier.supplier_name }}" required>
                </div>
                <div class="mb-3">
                    <label for="contact_name" class="form-label">Contact</label>
                    <input type="text" class="form-control" id="contact_name" name="contact_name" value="{{ supplier.contact_name or '' }}">
                </div>
                <div class="mb-3">
                    <label for="contact_phone" class="form-label">Contact Phone</label>
                    <input type="text" class="form-control" id="contact_phone" name="contact_phone" value="{{ supplier.contact_phone or '' }}">
                </div>
                <div class="mb-3">
                    <label for="tax_id" class="form-label">Tax ID</label>
                    <input type="text" class="form-control" id="tax_id" name="tax_id" value="{{ supplier.tax_id or '' }}">
                </div>
                <div class="mb-3">
                    <label for="supplier_address" class="form-label">Address</label>
                    <input type="text" class="form-control" id="supplier_address" name="supplier_address" value="{{ supplier.supplier_address or '' }}">
                </div>
                <div class="mb-3">
                    <label for="bank_info" class="form-label">Bank/Account No.</label>
                    <textarea class="form-control" id="bank_info" name="bank_info" rows="2">{{ supplier.bank_info or '' }}</textarea>
                </div>
                <div class="mb-3">
                    <label for="notes" class="form-label">Notes</label>
                    <textarea class="form-control" id="notes" name="notes" rows="2">{{ supplier.notes or '' }}</textarea>
                </div>
                <div class="mt-4">
                    <a href="{{ url_for('suppliers') }}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
