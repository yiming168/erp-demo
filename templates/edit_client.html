{% extends "base.html" %}
{% set active_page = "clients" %}

{% block title %}Edit Client - NorthPeak Biotech ERP{% endblock %}

{% block content %}
<div class="container">
        <h4><i class="bi bi-pencil-square"></i> Edit Client</h4>
        <hr>

        <div class="card">
            <div class="card-body">
                <form action="{{ url_for('edit_client', client_id=client.client_id) }}" method="POST">
                    <div class="mb-3">
                        <label for="company_name" class="form-label">Company Name</label>
                        <input type="text" class="form-control" id="company_name" name="company_name" value="{{ client.company_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="company_address" class="form-label">Company Address</label>
                        <input type="text" class="form-control" id="company_address" name="company_address" value="{{ client.company_address or '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="tax_id" class="form-label">Tax ID</label>
                        <input type="text" class="form-control" id="tax_id" name="tax_id" value="{{ client.tax_id or '' }}">
                    </div>
                    <div class="mt-4">
                        <a href="{{ url_for('clients') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
