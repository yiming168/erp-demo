{% extends "base.html" %}
{% set active_page = "clients" %}

{% block title %}Edit Shipping Address - NorthPeak Biotech ERP{% endblock %}

{% block content %}
<div class="container">
        <h4><i class="bi bi-pencil-square"></i> Edit Shipping Address</h4>
        <hr>

        <div class="card">
            <div class="card-body">
                <form action="{{ url_for('edit_shipping_address', address_id=address.address_id) }}" method="POST">
                    <input type="hidden" name="client_id" value="{{ address.client_id }}">
                    <div class="mb-3">
                        <label for="address" class="form-label">Shipping Address</label>
                        <textarea class="form-control" id="address" name="address" rows="3" required>{{ address.address }}</textarea>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="is_default" name="is_default" {% if address.is_default %}checked{% endif %}>
                        <label class="form-check-label" for="is_default">Set as default address</label>
                    </div>
                    <div class="mt-4">
                        <a href="{{ url_for('clients') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
