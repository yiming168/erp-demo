{% extends "base.html" %}
{% set active_page = "samples" %}

{% block title %}Edit Sample - NorthPeak Biotech ERP{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>🧪 Edit Sample</h4>
        <a href="{{ url_for('samples') }}" class="btn btn-secondary">Back to Samples</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form action="{{ url_for('edit_sample', sample_no=sample.sample_no) }}" method="POST">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Sample No.</label>
                        <input type="text" class="form-control" name="sample_no"
                               value="{{ sample.sample_no }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Entity</label>
                        <select class="form-select" name="company_id" required>
                            {% for company in companies %}
                            <option value="{{ company.company_id }}"
                                    {% if company.company_id == sample.company_id %}selected{% endif %}>
                                {{ company.short_name or company.company_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Request Date *</label>
                        <input type="date" class="form-control" name="order_date"
                               value="{{ sample.request_date.strftime('%Y-%m-%d') if sample.request_date else '' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Client *</label>
                        <select class="form-select" id="client_id" name="client_id" required>
                            {% for client in clients %}
                            <option value="{{ client.client_id }}"
                                    {% if client.client_id == sample.client_id %}selected{% endif %}>
                                {{ client.company_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Contact</label>
                        <select class="form-select" id="contact_id" name="contact_id">
                            <option value="">No contact</option>
                            {% for c in contacts %}
                            <option value="{{ c.contact_id }}"
                                    {% if c.contact_id == sample.contact_id %}selected{% endif %}>
                                {{ c.contact_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Shipping Address</label>
                        <textarea class="form-control" name="shipping_address" rows="2">{{ sample.shipping_address or '' }}</textarea>
                    </div>
                </div>

                <hr class="my-4">
                <h6 class="mb-3">Sample Product Details</h6>

                <div id="items-container">
                    {% for it in items %}
                    <div class="item-row border rounded p-3 mb-2 position-relative">
                        <button type="button" class="btn-close position-absolute top-0 end-0 m-2 remove-item"></button>
                        <div class="row g-2">
                            <div class="col-md-3">
                                <label class="form-label">Product *</label>
                                <select class="form-select product-select" name="product_id" required>
                                    {% for p in products %}
                                    <option value="{{ p.product_id }}"
                                            {% if p.product_id == it.product_id %}selected{% endif %}>
                                        {{ p.chinese_name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Quantity (kg) *</label>
                                <input type="number" step="0.001" class="form-control" name="quantity"
                                       value="{{ it.quantity }}" required>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Agreed Potency</label>
                                <input type="number" step="0.01" class="form-control" name="agreed_cfu"
                                       value="{{ it.agreed_cfu or '' }}">
                            </div>
                            <div class="col-md-1">
                                <label class="form-label">Packaging Spec</label>
                                <input type="text" class="form-control" name="packaging_spec"
                                       value="{{ it.packaging_spec or '' }}" list="packaging_options">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Shipping Date</label>
                                <input type="date" class="form-control" name="shipping_date"
                                       value="{{ it.shipping_date.strftime('%Y-%m-%d') if it.shipping_date else '' }}">
                            </div>
                            <div class="col-md-1">
                                <label class="form-label">Tracking No.</label>
                                <input type="text" class="form-control" name="tracking_no"
                                       value="{{ it.tracking_no or '' }}">
                            </div>
                            <div class="col-md-1">
                                <label class="form-label">Logistics Company</label>
                                <input type="text" class="form-control" name="logistics_company"
                                       value="{{ it.logistics_company or '' }}">
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>

                <datalist id="packaging_options">
                    <option value="1kg/bag">
                    <option value="5kg/bag">
                    <option value="100g/bag">
                    <option value="500g/bag">
                </datalist>

                <button type="button" class="btn btn-outline-secondary btn-sm mb-3" id="add-item">+ Add Product</button>

                <hr class="my-3">
                <div>
                    <label class="form-label">Notes</label>
                    <textarea class="form-control" name="notes" rows="2">{{ sample.notes or '' }}</textarea>
                </div>

                <hr class="my-4">
                <button class="btn btn-primary" type="submit">Save Changes</button>
                <a href="{{ url_for('samples') }}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const productsJson = {{ products | tojson }};

function buildItemRow() {
    let opts = '<option value="" disabled selected>Select product...</option>' +
        productsJson.map(p => `<option value="${p.product_id}">${p.chinese_name}</option>`).join('');
    const div = document.createElement('div');
    div.className = 'item-row border rounded p-3 mb-2 position-relative';
    div.innerHTML = `
        <button type="button" class="btn-close position-absolute top-0 end-0 m-2 remove-item"></button>
        <div class="row g-2">
            <div class="col-md-3"><label class="form-label">Product *</label>
                <select class="form-select" name="product_id" required>${opts}</select></div>
            <div class="col-md-2"><label class="form-label">Quantity (kg) *</label>
                <input type="number" step="0.001" class="form-control" name="quantity" required></div>
            <div class="col-md-2"><label class="form-label">Agreed Potency</label>
                <input type="number" step="0.01" class="form-control" name="agreed_cfu"></div>
            <div class="col-md-1"><label class="form-label">Packaging Spec</label>
                <input type="text" class="form-control" name="packaging_spec" list="packaging_options" placeholder="1kg/bag"></div>
            <div class="col-md-2"><label class="form-label">Shipping Date</label>
                <input type="date" class="form-control" name="shipping_date"></div>
            <div class="col-md-1"><label class="form-label">Tracking No.</label>
                <input type="text" class="form-control" name="tracking_no"></div>
            <div class="col-md-1"><label class="form-label">Logistics Company</label>
                <input type="text" class="form-control" name="logistics_company"></div>
        </div>`;
    div.querySelector('.remove-item').addEventListener('click', () => {
        if (document.querySelectorAll('.item-row').length > 1) div.remove();
    });
    return div;
}

document.querySelectorAll('.remove-item').forEach(btn => btn.addEventListener('click', function() {
    if (document.querySelectorAll('.item-row').length > 1) btn.closest('.item-row').remove();
}));

document.getElementById('add-item').addEventListener('click', () => {
    document.getElementById('items-container').appendChild(buildItemRow());
});

document.getElementById('client_id').addEventListener('change', async function() {
    const sel = document.getElementById('contact_id');
    sel.innerHTML = '<option value="">Loading...</option>';
    try {
        const r = await fetch(`/api/clients/${this.value}/contacts`).then(r => r.json());
        sel.innerHTML = '<option value="">No contact</option>';
        r.forEach(c => sel.innerHTML += `<option value="${c.contact_id}">${c.contact_name}</option>`);
    } catch { sel.innerHTML = '<option value="">Failed to load</option>'; }
});
</script>
{% endblock %}
