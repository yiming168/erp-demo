{% extends "base.html" %}
{% set active_page = "finance" %}

{% block title %}Edit Receipt - NorthPeak Biotech ERP{% endblock %}

{% block content %}
<div class="container">
        <h4 class="mb-3">Edit Receipt</h4>
        <div class="card">
            <div class="card-body">
                <form action="{{ url_for('edit_receipt', receipt_id=receipt.receipt_id) }}" method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Related Order</label>
                            <input type="text" class="form-control" value="#{{ receipt.contract_id }} - {{ receipt.contract_no or 'No Contract No.' }} ({{ receipt.company_name }})" disabled>
                        </div>
                        <div class="col-md-6">
                            <label for="payment_date" class="form-label">Payment Date *</label>
                            <input type="date" class="form-control" id="payment_date" name="payment_date" value="{{ receipt.payment_date.strftime('%Y-%m-%d') if receipt.payment_date else today }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="payment_amount" class="form-label">Payment Amount *</label>
                            <input type="number" step="0.01" class="form-control" id="payment_amount" name="payment_amount" value="{{ receipt.payment_amount }}" required>
                        </div>
                        <div class="col-12">
                            <label for="remark" class="form-label">Notes</label>
                            <textarea class="form-control" id="remark" name="remark" rows="3">{{ receipt.remark or '' }}</textarea>
                        </div>
                    </div>
                    <hr class="my-4">
                    <button class="btn btn-primary" type="submit">Save Changes</button>
                    <a href="{{ url_for('receipts', company_id=receipt.company_id) }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
