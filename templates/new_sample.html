{% extends "base.html" %}
{% set active_page = "samples" %}

{% block title %}New Sample - NorthPeak Biotech ERP{% endblock %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>🧪 New Sample</h4>
        <a href="{{ url_for('samples') }}" class="btn btn-secondary">Back to Samples</a>
    </div>

    <div class="card">
        <div class="card-body">
            <form action="{{ url_for('new_sample') }}" method="POST">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="sample_no" class="form-label">Sample No.</label>
                        <input type="text" class="form-control" id="sample_no" name="sample_no"
                               value="{{ next_sample_no }}" placeholder="SP-2026-001" readonly>
                        <input type="hidden" name="sample_no_mode" value="auto">
                    </div>
                    <div class="col-md-4">
                        <label for="company_id" class="form-label">Entity</label>
                        <select class="form-select" id="company_id" name="company_id" required>
                            {% for company in companies %}
                            <option value="{{ company.company_id }}"
                                    {% if company.company_id == default_company_id %}selected{% endif %}>
                                {{ company.short_name or company.company_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="order_date" class="form-label">Request Date *</label>
                        <input type="date" class="form-control" id="order_date" name="order_date"
                               required value="{{ today }}">
                    </div>

                    <div class="col-md-6">
                        <label for="client_id" class="form-label">Client *</label>
                        <select class="form-select" id="client_id" name="client_id" required>
                            <option value="" disabled selected>Select a client...</option>
                            {% for client in clients %}
                            <option value="{{ client.client_id }}">{{ client.company_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="contact_id" class="form-label">Contact</label>
                        <select class="form-select" id="contact_id" name="contact_id">
                            <option value="" selected>Select a client first</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label for="shipping_address_select" class="form-label">Shipping Address *</label>
                        <select class="form-select mb-2" id="shipping_address_select">
                            <option value="" disabled selected>Select a client first</option>
                        </select>
                        <textarea class="form-control" id="shipping_address" name="shipping_address"
                                  rows="2" required placeholder="Choose an address above or enter manually"></textarea>
                    </div>
                </div>

                <hr class="my-4">
                <h6 class="mb-3">Sample Product Details <span class="text-muted small">(you can add multiple products)</span></h6>

                <div id="items-container">
                    <div class="item-row border rounded p-3 mb-2 position-relative">
                        <button type="button" class="btn-close position-absolute top-0 end-0 m-2 remove-item" title="Remove"></button>
                        <div class="row g-2">
                            <div class="col-md-4">
                                <label class="form-label">Product *</label>
                                <select class="form-select product-select" name="product_id" required>
                                    <option value="" disabled selected>Select product...</option>
                                    {% for p in products %}
                                    <option value="{{ p.product_id }}"
                                            data-potency="{{ p.standard_potency or '' }}"
                                            data-unit="{{ p.potency_unit or 'CFU/g' }}">
                                        {{ p.chinese_name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Quantity (kg) *</label>
                                <input type="number" step="0.001" class="form-control" name="quantity" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Agreed Potency</label>
                                <input type="number" step="0.01" class="form-control agreed-cfu" name="agreed_cfu"
                                       placeholder="Leave blank to use the product's standard value">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Packaging Spec</label>
                                <input type="text" class="form-control" name="packaging_spec"
                                       list="packaging_options" placeholder="Default 1kg/bag">
                            </div>
                        </div>
                    </div>
                </div>

                <datalist id="packaging_options">
                    <option value="1kg/bag">
                    <option value="5kg/bag">
                    <option value="25kg/bag">
                    <option value="100g/bag">
                    <option value="500g/bag">
                </datalist>

                <button type="button" class="btn btn-outline-secondary btn-sm mb-3" id="add-item">
                    + Add Product
                </button>

                <hr class="my-3">
                <div class="col-12">
                    <label for="notes" class="form-label">Notes</label>
                    <textarea class="form-control" id="notes" name="notes" rows="2"
                              placeholder="Sample purpose, shipping instructions, etc."></textarea>
                </div>

                <hr class="my-4">
                <button class="btn btn-success" type="submit">Save Sample</button>
                <a href="{{ url_for('samples') }}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const clientSelect = document.getElementById('client_id');
const contactSelect = document.getElementById('contact_id');
const addressSelect = document.getElementById('shipping_address_select');
const addressTextarea = document.getElementById('shipping_address');
const companySelect = document.getElementById('company_id');
const orderDateInput = document.getElementById('order_date');
const sampleNoInput = document.getElementById('sample_no');

async function refreshSampleNo() {
    const params = new URLSearchParams({
        company_id: companySelect.value,
        order_date: orderDateInput.value || ''
    });
    try {
        const data = await fetch(`/api/sample-no?${params.toString()}`).then(r => r.json());
        if (data.sample_no) sampleNoInput.value = data.sample_no;
    } catch {}
}

companySelect.addEventListener('change', refreshSampleNo);
orderDateInput.addEventListener('change', refreshSampleNo);

clientSelect.addEventListener('change', async function() {
    const clientId = this.value;
    contactSelect.innerHTML = '<option value="" selected>Loading...</option>';
    addressSelect.innerHTML = '<option value="" disabled selected>Loading...</option>';
    addressTextarea.value = '';
    try {
        const [cr, ar] = await Promise.all([
            fetch(`/api/clients/${clientId}/contacts`).then(r => r.json()),
            fetch(`/api/clients/${clientId}/shipping_addresses`).then(r => r.json()),
        ]);
        contactSelect.innerHTML = '<option value="" selected>No contact</option>';
        cr.forEach(c => {
            contactSelect.innerHTML += `<option value="${c.contact_id}">${c.contact_name}</option>`;
        });
        addressSelect.innerHTML = '<option value="" selected>Select a saved address or enter manually</option>';
        ar.forEach(a => {
            const def = a.is_default ? ' [Default]' : '';
            addressSelect.innerHTML += `<option value="${a.address}">${a.address}${def}</option>`;
            if (a.is_default && !addressTextarea.value) addressTextarea.value = a.address;
        });
    } catch {
        contactSelect.innerHTML = '<option value="" selected>Failed to load</option>';
    }
});

addressSelect.addEventListener('change', function() {
    addressTextarea.value = this.value;
});

function buildItemRow() {
    const products = [...document.querySelector('.item-row .product-select').options];
    let opts = products.map(o => `<option value="${o.value}" data-potency="${o.dataset.potency || ''}" data-unit="${o.dataset.unit || 'CFU/g'}" ${o.disabled ? 'disabled' : ''}>${o.text}</option>`).join('');
    const div = document.createElement('div');
    div.className = 'item-row border rounded p-3 mb-2 position-relative';
    div.innerHTML = `
        <button type="button" class="btn-close position-absolute top-0 end-0 m-2 remove-item" title="Remove"></button>
        <div class="row g-2">
            <div class="col-md-4">
                <label class="form-label">Product *</label>
                <select class="form-select product-select" name="product_id" required>
                    ${opts}
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Quantity (kg) *</label>
                <input type="number" step="0.001" class="form-control" name="quantity" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Agreed Potency</label>
                <input type="number" step="0.01" class="form-control agreed-cfu" name="agreed_cfu">
            </div>
            <div class="col-md-3">
                <label class="form-label">Packaging Spec</label>
                <input type="text" class="form-control" name="packaging_spec" list="packaging_options" placeholder="Default 1kg/bag">
            </div>
        </div>`;
    div.querySelector('.product-select').addEventListener('change', syncPotency);
    div.querySelector('.remove-item').addEventListener('click', function() {
        if (document.querySelectorAll('.item-row').length > 1) div.remove();
    });
    return div;
}

function syncPotency(e) {
    const opt = e.target.options[e.target.selectedIndex];
    const potency = opt.dataset.potency;
    const cfuInput = e.target.closest('.item-row').querySelector('.agreed-cfu');
    if (potency && !cfuInput.value) cfuInput.value = potency;
}

document.querySelectorAll('.product-select').forEach(s => s.addEventListener('change', syncPotency));
document.querySelectorAll('.remove-item').forEach(btn => btn.addEventListener('click', function() {
    if (document.querySelectorAll('.item-row').length > 1) btn.closest('.item-row').remove();
}));

document.getElementById('add-item').addEventListener('click', function() {
    document.getElementById('items-container').appendChild(buildItemRow());
});
</script>
{% endblock %}
