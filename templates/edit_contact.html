{% extends "base.html" %}
{% set active_page = "clients" %}

{% block title %}Edit Contact - NorthPeak Biotech ERP{% endblock %}

{% block content %}
<div class="container">
        <h4><i class="bi bi-pencil-square"></i> Edit Contact</h4>
        <hr>

        <div class="card">
            <div class="card-body">
                <form action="{{ url_for('edit_contact', contact_id=contact.contact_id) }}" method="POST">
                    <div class="mb-3">
                        <label for="contact_name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="contact_name" name="contact_name" value="{{ contact.contact_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ contact.title or '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="cellphone" class="form-label">Mobile Number</label>
                        <input type="text" class="form-control" id="cellphone" name="cellphone" value="{{ contact.cellphone or '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="other_info" class="form-label">Other Information</label>
                        <textarea class="form-control" id="other_info" name="other_info" rows="3">{{ contact.other_info or '' }}</textarea>
                    </div>
                    <div class="mt-4">
                        <a href="{{ url_for('clients') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
